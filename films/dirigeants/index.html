<body><div id="scene"><div class="monde" id="monde"></div><div class="calque" id="dessus"></div><div class="monde" id="pointeur"></div></div>
<script type="module">
import * as M from '../moteur/moteur.js';
import { Calendrier, Rang, Horloge, icone } from '../moteur/composants.js';
const { el, st, at, W, H, C, clamp, lerp, prog, ressort, piste, glisse, entreSort, sort, sortExpo, entre, visible } = M;

const DUREE = 27;
const PH = '../medias/photos/dirigeants/';
const monde = document.getElementById('monde');
const dessus = document.getElementById('dessus');
const pointeur = document.getElementById('pointeur');
const bosse = (t, t0, d) => (t < t0 || t > t0 + d ? 0 : Math.sin(Math.PI * (t - t0) / d));
const dans = (t, a, b) => t >= a && t < b;
const NB = ' ';

// ----------------------------------------------------------------------------------------------
// Décors recopiés dans chaque verre
// ----------------------------------------------------------------------------------------------
const X = {};
const decorBureau = c => {
  const i = el('img', { src: PH + 'bureau.jpg' }, c);
  Object.assign(i.style, { position: 'absolute', left: '0', top: '0', width: W + 'px', height: H + 'px', objectFit: 'cover', transformOrigin: '0 0' });
  return { img: i };
};
function decorOutil(c) {
  const d = decorBureau(c);
  d.page = construirePage(c);
  return d;
}
function construirePage(c) {
  const p = el('div', { class: 'page' }, c);
  const barres = [];
  const ajout = (x, y, w, h, coul) => { const b = el('div', { class: 'barre' }, p); Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', background: coul || '#C9D6E6' }); barres.push(b); return b; };
  ajout(70, 70, 280, 30, C.nuit);
  ajout(70, 132, 420, 14); ajout(70, 168, 300, 14);
  ajout(620, 70, 310, 14); ajout(700, 106, 230, 14);
  for (let i = 0; i < 6; i++) { ajout(70, 250 + i * 52, 560 - (i % 3) * 70, 14); ajout(800, 250 + i * 52, 130, 14); }
  ajout(690, 580, 240, 30, C.nuit);
  const sep = el('div', {}, p); Object.assign(sep.style, { position: 'absolute', left: '70px', top: '660px', width: '860px', height: '2px', background: C.bord });
  const temps = [], longueurs = [760, 600, 690, 520, 640];
  for (let i = 0; i < 5; i++) {
    const h = el('div', {}, p);
    Object.assign(h.style, { position: 'absolute', left: '70px', top: 700 + i * 50 + 'px', width: '34px', height: '34px' });
    h.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#A96F14" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';
    const b = el('div', { class: 'temps' }, p); Object.assign(b.style, { left: '124px', top: 705 + i * 50 + 'px', width: longueurs[i] + 'px' });
    temps.push({ b, h });
  }
  return { p, barres, temps };
}
const valeurCurseur = t => 0.08 + 0.78 * glisse(t, 0, [[12.0, 1, 0.85]]);
function majDecorOutil(d, t, yPage, yPhoto) {
  st(d.img, { transform: `translateY(${yPhoto.toFixed(2)}px)` });
  const p = d.page;
  st(p.p, { transform: `translate(220px,${yPage.toFixed(2)}px)`, visibility: yPage < H + 10 ? 'inherit' : 'hidden' });
  p.barres.forEach((b, i) => st(b, { transform: `scaleX(${clamp(ressort(t - 11.08 - i * 0.022, 'sec'), 0, 1.04).toFixed(4)})` }));
  p.temps.forEach((o, i) => {
    const apparait = ressort(t - 11.5 - i * 0.04, 'vif');
    const court = 1 - 0.62 * glisse(t, 0, [[12.0 + i * 0.05, 1, 0.85]]);
    st(o.b, { transform: `scaleX(${(apparait * court).toFixed(4)})` });
    st(o.h, { transform: `scale(${clamp(apparait, 0, 1.2).toFixed(4)})` });
  });
}

// ----------------------------------------------------------------------------------------------
// Bento : grille 3 x 3 de tuiles de 380 px, pas de 404 px, centrée sur (720, 900)
// ----------------------------------------------------------------------------------------------
const PAS = 404, TU = 380;
// col, lig de -1 à 1 ; de : tuile depuis laquelle elle se déplie ; doc : étiquette de document.
const TUILES = [
  { col: 0, lig: -1, src: 'client.jpg', doc: 'Réponse client', vague: 0 },
  { col: -1, lig: 0, src: 'atelier.jpg', vague: 0 },
  { col: 1, lig: 0, src: 'vitre.jpg', doc: 'Contrat', vague: 0 },
  { col: 0, lig: 1, src: 'reunion.jpg', doc: 'Compte rendu', vague: 0 },
  { col: -1, lig: -1, src: 'equipe.jpg', vague: 1, axe: 'x' },
  { col: 1, lig: -1, nuit: true, vague: 1, axe: 'x' },
  { col: -1, lig: 1, src: 'plan.jpg', doc: 'Fiche technique', vague: 1, axe: 'x' },
  { col: 1, lig: 1, src: 'mains.jpg', vague: 1, axe: 'x' },
];
// Plongée dans « Devis » (temps 16) : facteur de zoom appliqué aux tailles réelles, sans agrandir le monde,
// pour que le navigateur dessine des éléments à leur taille d'écran.
const S_PLONGEE = 1800 / 380;
const zb = t => (t >= 7.55 && t < 8.0 ? Math.exp(Math.log(S_PLONGEE) * entreSort(prog(t, 7.55, 0.45))) : 1);
// Le centre (Devis) est la forme de l'ouverture.
function souleveTuile(T, t) {
  if (T.doc === 'Contrat') return piste(t, 1, [[6.0, 1.045, 'vif'], [6.42, 1, 'vif']]);
  return 1;
}
function geoTuile(T, t) {
  const cx = 720 + T.col * PAS, cy = 900 + T.lig * PAS;
  const t0 = T.vague === 0 ? 4.0 : 4.5;
  const p = clamp(ressort(t - t0 - (Math.abs(T.col) + Math.abs(T.lig)) * 0.02, 'vif'), 0, 1.08);
  let ox = '50%', oy = '50%', sx = 1, sy = 1;
  if (T.vague === 0) {
    if (T.lig === -1) { oy = '100%'; sy = p; } else if (T.lig === 1) { oy = '0%'; sy = p; }
    else if (T.col === -1) { ox = '100%'; sx = p; } else { ox = '0%'; sx = p; }
  } else { ox = T.col === -1 ? '100%' : '0%'; sx = p; }
  const s = souleveTuile(T, t);
  return { cx, cy, sx: sx * s, sy: sy * s, ox, oy, p, s };
}
function styleTuile(g) {
  return { transform: `translate(${g.cx - TU / 2}px,${g.cy - TU / 2}px) scale(${g.sx.toFixed(4)},${g.sy.toFixed(4)})`, transformOrigin: `${g.ox} ${g.oy}`, visibility: g.sx > 0.003 && g.sy > 0.003 ? 'inherit' : 'hidden' };
}
// Copie d'une tuile pour le verre de son étiquette.
const decorTuile = src => c => { const b = el('div', { class: 'tuile' }, c); b.style.boxShadow = 'none'; el('img', { src: PH + src }, b); return { b }; };

// ----------------------------------------------------------------------------------------------
// Construction
// ----------------------------------------------------------------------------------------------
async function construire() {
  // --- Bento (derrière la tuile centrale) ---
  X.bento = el('div', { class: 'abs' }, monde);
  X.tuiles = TUILES.map(T => {
    const e = el('div', { class: 'tuile' + (T.nuit ? ' tuile-nuit' : '') }, X.bento);
    if (T.nuit) { T.horlogeNuit = new Horloge(e, 230, C.lampe, 'rgba(255,255,255,0.04)'); }
    else el('img', { src: PH + T.src }, e);
    return { T, e };
  });

  // --- Ouverture : mot-marque, point, pilule, iris, tuile centrale « Devis » ---
  X.ouv = el('div', { class: 'abs' }, monde);
  X.forme = el('div', { class: 'pilule' }, X.ouv);
  X.formePhoto = el('img', { class: 'pilule-photo', src: PH + 'bureau.jpg' }, X.forme);
  X.formeNuit = el('div', {}, X.forme); Object.assign(X.formeNuit.style, { position: 'absolute', inset: '0', background: C.nuit });
  X.accroche = el('div', { class: 'accroche' }, X.forme);
  X.accrocheTexte = M.texteMasque(X.accroche, `Chacun gagne <span class="fait"><span class="fait-trait"></span><span class="fait-mot">1${NB}h</span></span> par semaine`);
  X.trait = X.accroche.querySelector('.fait-trait');
  X.faitMot = X.accroche.querySelector('.fait-mot');
  X.irisSvg = el('svg:svg', { width: '100%', height: '100%', style: 'position:absolute;left:0;top:0;overflow:visible' }, X.forme);
  X.lames = [...Array(6)].map(() => el('svg:path', { fill: C.nuit, stroke: '#2B3F60', 'stroke-width': '2.5', 'stroke-linejoin': 'round' }, X.irisSvg));
  X.mm = new M.MotMarque(X.ouv, 'antoinecontino.fr', { police: '"Instrument Serif"', taille: 176, couleur: C.nuit, espacement: -176 * 0.018, indicePoint: 14 });
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = '400 106px "Instrument Serif"';
  X.pilW = Math.ceil(ctx.measureText(`Chacun gagne 1${NB}h par semaine`).width) + 140;
  X.pilH = 212;
  X.appelW = Math.ceil(ctx.measureText('Réservez votre audit gratuit').width) + 140;

  // Étiquettes de verre et horloges des tuiles de documents (centre compris).
  X.puces = [];
  const docs = [...TUILES.filter(T => T.doc), { col: 0, lig: 0, src: 'bureau.jpg', doc: 'Devis', centre: true }];
  const mes = document.createElement('canvas').getContext('2d'); mes.font = '600 34px Inter';
  for (const T of docs) {
    const v = new M.Verre(X.ouv, { r: 34, biseau: 30, force: 46, teinte: 'rgba(255,255,255,0.66)', decor: decorTuile(T.src), marge: 40 });
    el('div', { class: 'puce', text: T.doc }, v.contenu);
    const hz = el('div', { class: 'horloge-tuile' }, X.ouv);
    const hor = new Horloge(hz, 64, C.ocre, '#fff');
    X.puces.push({ T, v, w: Math.ceil(mes.measureText(T.doc).width) + 48, hz, hor });
  }

  // --- Outil ---
  X.outil = el('div', { class: 'abs' }, monde);
  X.decor = decorOutil(X.outil);
  X.gooCalque = el('div', { class: 'abs' }, X.outil);
  const ctxL = document.createElement('canvas').getContext('2d'); ctxL.font = '400 400px "Instrument Serif"';
  const mot = 'Devis';
  X.lettres = [...mot].map((ch, i) => {
    const l = new M.LettreVerre(X.gooCalque, ch, { police: '"Instrument Serif"', taille: 400, biseau: 30, force: 74, decor: decorOutil });
    l.x = ctxL.measureText(mot.slice(0, i)).width; return l;
  });
  X.motL = ctxL.measureText(mot).width;
  X.barre = new M.Verre(X.outil, { r: 70, biseau: 54, force: 96, teinte: 'rgba(255,255,255,0.58)', decor: decorOutil });
  X.requete = el('div', { class: 'requete' }, X.barre.contenu);
  X.requeteTexte = el('span', {}, X.requete); X.caret = el('span', { class: 'caret' }, X.requete);
  X.envoi = el('div', { class: 'envoi' }, X.barre.contenu); icone(X.envoi, 'envoi', { taille: 50, couleur: '#fff', epaisseur: 2.4 });
  X.panneau = new M.Verre(X.outil, { r: 48, biseau: 44, force: 80, teinte: 'rgba(255,255,255,0.5)', decor: decorOutil });
  el('div', { class: 'titre-curseur', text: 'Carte des heures perdues' }, X.panneau.contenu);
  const pp = el('div', { class: 'piste' }, X.panneau.contenu); Object.assign(pp.style, { top: '172px', width: '988px' });
  X.panPlein = el('div', { class: 'piste-pleine' }, X.panneau.contenu); Object.assign(X.panPlein.style, { top: '172px', width: '988px' });
  X.bouton = el('div', { class: 'bouton-rond' }, X.outil);
  X.loupe = new M.Verre(X.outil, { r: 400, biseau: 60, force: 120, teinte: 'rgba(255,255,255,0.06)', decor: decorOutil, marge: 80 });
  const blocsCal = [{ jour: 0, ligne: 0, duree: 2 }, { jour: 1, ligne: 1, duree: 1 }, { jour: 2, ligne: 0, duree: 1 }, { jour: 2, ligne: 2, duree: 2 }, { jour: 3, ligne: 1, duree: 2 }, { jour: 4, ligne: 0, duree: 1 }];
  X.orbeCal = new Calendrier(X.loupe.contenu, { largeur: 560, hauteur: 420, lignes: 4, taillePolice: 34, fond: 'rgba(255,255,255,0.92)', blocs: blocsCal, libre: { jour: 4, ligne: 2 } });

  // --- Équipe : fenêtre Mac devenue navigateur, blocs, titre ---
  X.equipe = el('div', { class: 'abs' }, monde);
  X.fen = el('div', { class: 'fenetre' }, X.equipe);
  X.fenBarre = el('div', { class: 'fen-barre' }, X.fen);
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { const f = el('div', { class: 'feu' }, X.fenBarre); Object.assign(f.style, { left: 34 + i * 38 + 'px', background: c }); });
  X.onglet = el('div', { class: 'onglet' }, X.fenBarre); el('i', {}, X.onglet); el('span', { text: 'antoinecontino.fr' }, X.onglet);
  X.fenContenu = el('div', { class: 'fen-contenu' }, X.fen);
  X.fenCal = new Calendrier(X.fenContenu, { largeur: 1060, hauteur: 795, lignes: 4, taillePolice: 64, fond: '#fff', blocs: blocsCal, libre: { jour: 4, ligne: 2 } });
  X.hero = el('div', { class: 'hero' }, X.fenContenu);
  el('img', { src: '../medias/boucle-jour-affiche.jpg' }, X.hero);
  el('div', { class: 'hero-voile' }, X.hero);
  el('div', { class: 'hero-marque', text: 'Antoine Contino' }, X.hero);
  X.heroTitre = M.texteMasque(el('div', { class: 'hero-titre' }, X.hero), 'Une heure gagnée par semaine');
  X.heroBouton = el('div', { class: 'hero-bouton', text: 'Réserver mon audit gratuit' }, X.hero);
  X.titreEquipe = el('div', { class: 'titre-equipe' }, X.equipe);
  X.titreL1 = M.texteMasque(el('div', {}, X.titreEquipe), 'Jusqu’à 5 personnes,');
  X.titreL2 = M.texteMasque(el('div', {}, X.titreEquipe), 'sur vos documents');
  X.libre = el('div', { class: 'bloc-libre' }, X.equipe);
  X.libreTexte = M.texteMasque(X.libre, `Vendredi${NB}: 1${NB}h libre`);
  Object.assign(X.libreTexte.i.style, { font: '600 52px Inter', color: '#fff', whiteSpace: 'nowrap' });
  X.gooBlocs = el('div', { class: 'abs' }, X.equipe);
  X.goutte = el('div', {}, X.gooBlocs); Object.assign(X.goutte.style, { position: 'absolute', left: '0', top: '0', width: '96px', height: '96px', borderRadius: '50%', background: C.vert });
  X.blocs = ['AB', 'CL', 'JM', 'SR', 'TP'].map((ini, i) => {
    const b = el('div', { class: 'bloc-equipe' }, i === 4 ? X.gooBlocs : X.equipe);
    const a = el('div', { class: 'avatar', text: ini }, b);
    const h = el('b', { text: `1${NB}h` }, b);
    return { b, a, h };
  });

  // --- Preuve et monde réel (calque du dessus, sans caméra) ---
  X.reel = el('div', { class: 'abs' }, dessus);
  X.preuve = el('div', { class: 'abs' }, dessus);
  X.carte = el('div', { class: 'carte-sombre' }, X.preuve);
  X.feuilleTexte = el('div', { class: 'feuille' }, X.preuve);
  X.rangs = [
    new Rang(X.feuilleTexte, { html: `Audit gratuit, 30${NB}min`, icone: 'calendrier', coche: true }),
    new Rang(X.feuilleTexte, { html: 'Une journée chez vous', image: '../medias/portrait.webp' }),
    new Rang(X.feuilleTexte, { html: 'À midi, vous décidez si vous payez', icone: 'soleil' }),
    new Rang(X.feuilleTexte, { html: `Elle gagne <span style="color:#F7E495">10${NB}h</span> par semaine`, icone: 'guillemets', sous: 'Dirigeante formée en Moselle' }),

// Soulèvement et appui de la tuile centrale « Devis » pendant le bento.
const liftCentre = t => piste(t, 1, [[6.5, 1.045, 'vif'], [7.0, 0.975, 'sec'], [7.5, 1.0, 'vif']]);

function ouverture(t) {
  const actif = t < 8.02;

  let h = piste(t, pt.d, [[0.42, X.pilH, 'vif'], [2.82, 640, 'vif'], [3.2, 980, 'vif'], [3.5, TU, 'vif']]);
  const survol = piste(t, 1, [[2.0, 1.035, 'vif'], [2.5, 0.985, 'sec'], [2.62, 1, 'vif']]) * liftCentre(t);
  w *= survol * zb(t); h *= survol * zb(t);

  const ombre = clamp((survol - 1) / 0.035, 0, 1.5);
  st(X.forme, { width: w.toFixed(2) + 'px', height: h.toFixed(2) + 'px', borderRadius: Math.max(0, rayon).toFixed(2) + 'px',
    transform: `translate(${(cx - w / 2).toFixed(2)}px,${(cy - h / 2).toFixed(2)}px)`,
    boxShadow: `0 ${(30 * ombre).toFixed(1)}px ${(60 * ombre).toFixed(1)}px -20px rgba(14,26,43,0.45)` });
  M.monte(X.accrocheTexte, ressort(t - 0.6, 'vif'));
  st(X.trait, { transform: `scaleX(${clamp(ressort(t - 1.0, 'sec'), 0, 1.1).toFixed(4)})` });
  const pc = clamp(ressort(t - 1.0, 'sec'));
  st(X.faitMot, { color: `rgb(${Math.round(lerp(255, 247, pc))},${Math.round(lerp(255, 228, pc))},${Math.round(lerp(255, 149, pc))})` });
  visible(X.accroche, t < 2.9);

  visible(X.irisSvg, irisOn);
  if (irisOn) M.cheminsIris(w / 2, h / 2, a, Math.hypot(w, h), rot).forEach((d, i) => at(X.lames[i], { d }));
  visible(X.formeNuit, t < 2.95);

  for (const P of X.puces) {
    let g;
    if (P.T.centre) g = { cx: 720, cy: 900, s: w / TU };

    const s = g.s ?? 1;
    const pop = ressort(t - 5.0 - X.puces.indexOf(P) * 0.04, 'rebond') * (1 - entreSort(prog(t, 7.5, 0.14)));
    const tl = { x: g.cx - TU / 2 * s, y: g.cy - TU / 2 * s };

    const hx = g.cx + (TU / 2 - 16 - 32) * s, hy = g.cy + (-TU / 2 + 16 + 32) * s;
    const hp = ressort(t - 5.05 - X.puces.indexOf(P) * 0.04, 'rebond') * (1 - entreSort(prog(t, 7.5, 0.14)));
    st(P.hz, { transform: `translate(${hx - 32}px,${hy - 32}px) scale(${(Math.max(0, hp) * s).toFixed(4)})`, visibility: hp > 0.01 ? 'inherit' : 'hidden' });

}
// Aiguilles : un cran au temps 12 et au temps 14, tour rapide pendant l'appui long sur « Devis » (temps 15).
function minutesHorloge(t, centre) {

function bento(t) {

// ----------------------------------------------------------------------------------------------

const RANG_Y = 520, BX = [236, 478, 720, 962, 1204];

    st(B.h, { transform: `scale(${Math.max(0, ressort(t - ta - 0.06, 'rebond')).toFixed(4)})` });

function geoFenetre(t) {

const kContraction = t => glisse(t, 0, [[23.0, 1, 0.4, entreSort]]);

// ----------------------------------------------------------------------------------------------
// Monde réel et iris : temps 47 à 49
// ----------------------------------------------------------------------------------------------
const tPlan = t => clamp(t - 23.0 + 0.4, 0, 2.95);
function coinsEcran(tp) {
  const f = X.coins.frames;
  let i = f.findIndex(o => o.t >= tp); if (i < 1) i = 1;
  const a = f[i - 1], b = f[i], u = clamp((tp - a.t) / (b.t - a.t));
  const c = a.c.map((p, k) => [lerp(p[0], b.c[k][0], u), lerp(p[1], b.c[k][1], u)]);
  // Ordre pour la personne qui tape : haut gauche B, haut droit A, bas droit D, bas gauche C.
  return [c[1], c[0], c[3], c[2]];
}
async function reel(t) {
  const actif = t >= 22.98 && t < 24.34;
  visible(X.reel, actif);
  visible(X.ecran, actif && t > 23.45);
  visible(X.irisFinSvg, actif && t >= 24.0);
  if (!actif) return;
  const tp = tPlan(t);
  await X.plan.aller(tp);
  const ecranQ = coinsEcran(tp);
  const k = kContraction(t);
  const cadre = [[-140, -170], [W + 140, -170], [W + 140, H + 170], [-140, H + 170]];
  const q = cadre.map((p, j) => [lerp(p[0], ecranQ[j][0], k), lerp(p[1], ecranQ[j][1], k)]);
  at(X.voile, { points: q.map(p => p.map(v => v.toFixed(2)).join(',')).join(' ') });
  const cen = [0, 1].map(j => ecranQ.reduce((m, p) => m + p[j], 0) / 4);
  const ins = (p, o, s) => [lerp(p[0], o[0], s), lerp(p[1], o[1], s)];
  st(X.ecran, { transform: M.matrice3d(1600, 1000, q.map(p => ins(p, cen, 0.04))) });
  const pc = glisse(t, 0, [[23.47, 1, 0.38, entreSort]]);
  st(X.ecranCal.racine, { transform: `translate(800px,500px) scale(${pc.toFixed(4)}) translate(-800px,-500px)` });
  X.ecranCal.poser(t - 23.58);
  window.__ecranQ = q.map(p => ins(p, cen, 0.04));
  const cas = X.ecranCal.libreCase;
  const s = clamp(ressort(t - 23.7, 'rebond'), 0, 1.3);
  st(X.ecranLibre, { width: cas.w + 'px', height: cas.h + 'px', transform: `translate(${cas.x}px,${cas.y}px) scale(${s.toFixed(4)})`, transformOrigin: '50% 50%' });
  // Iris (temps 49) : les lames entrent, cadrent l'écran, puis se ferment.
  if (t >= 24.0) {
    const p1 = sort(prog(t, 24.0, 0.13)), p2 = entre(prog(t, 24.16, 0.16));
    const a = lerp(lerp(1500, 520, p1), 0, p2);
    M.cheminsIris(cen[0], cen[1], a, 2600, 0.5 * p1 + 0.5 * p2).forEach((d, i) => at(X.lamesFin[i], { d }));
  }
}

// ----------------------------------------------------------------------------------------------
// Fin : temps 50 à 54
// ----------------------------------------------------------------------------------------------
function fin(t) {
  const actif = t >= 24.3 && t < 26.2;
  visible(X.fin, actif);
  if (!actif) return;
  // Le noir de l'iris fermé se contracte en pilule (temps 50).
  const c = ressort(t - 24.3, 'sec');
  let w = lerp(2300, X.appelW, c), h = lerp(2700, X.pilH, c);
  const survol = piste(t, 1, [[25.0, 1.035, 'vif'], [25.5, 0.96, 'sec'], [25.62, 1, 'vif']]);
  // Clic (temps 52) : la pilule file vers le point du mot-marque.
  const pt = X.mm.poser(720, 900, 1);
  const vp = ressort(t - 25.75, 'sec');
  w = lerp(w * survol, pt.d, vp); h = lerp(h * survol, pt.d, vp);
  const cx = lerp(720, pt.x, ressort(t - 25.75, 'sec')), cy = lerp(900, pt.y, ressort(t - 25.75, 'sec'));
  const r = Math.min(w, h) / 2;
  st(X.finNoir, { width: w.toFixed(2) + 'px', height: h.toFixed(2) + 'px', borderRadius: r.toFixed(2) + 'px', transform: `translate(${(cx - w / 2).toFixed(2)}px,${(cy - h / 2).toFixed(2)}px)`, overflow: 'hidden' });
  M.monte(X.appelTexte, ressort(t - 24.36, 'vif') - entreSort(prog(t, 25.7, 0.12)));
  visible(X.appel, t < 25.84);
}
// Mot-marque de la fin : les lettres jaillissent du point sur la reprise (temps 53).
function motFin(t) {
  if (t < 26.0) return;
  // À partir de 26,2 s le point est la forme de l'ouverture dans son état de la première image.
  ouverture(0);
  visible(X.forme, t >= 26.2);
  const k = t > 26.95 ? 1 : Math.max(0, ressort(t - 26.0, 'rebond'));
  X.mm.poser(720, 900, k);
  visible(X.mm.racine, true);
}

// ----------------------------------------------------------------------------------------------
// Curseur
// ----------------------------------------------------------------------------------------------
function curseur(t, o) {
  let x = 1560, y = 1900, v = false, appui = 0, clic = -1, ech = 1;
  if (dans(t, 1.5, 2.95)) {
    v = true;
    x = glisse(t, 1500, [[1.5, 905, 0.48, sortExpo]]); y = glisse(t, 1700, [[1.5, 1000, 0.48, sortExpo]]);
    appui = bosse(t, 2.5, 0.16); clic = t >= 2.5 ? t - 2.5 : -1;
  } else if (dans(t, 5.75, 7.64)) {
    v = true;
    x = glisse(t, 1520, [[5.75, 1150, 0.28, sortExpo], [6.25, 760, 0.28, entreSort]]);
    y = glisse(t, 1760, [[5.75, 980, 0.28, sortExpo], [6.25, 960, 0.28, entreSort]]);
    appui = t >= 7.0 && t < 7.5 ? clamp((t - 7.0) / 0.06) : 0;
    clic = t >= 7.5 ? t - 7.5 : -1;
    ech = (1 - entreSort(prog(t, 7.5, 0.12))) * zb(t);
  } else if (dans(t, 9.4, 13.05) && o) {
    v = true;
    x = glisse(t, 1500, [[9.4, 330, 0.36, sortExpo], [10.6, 1180, 0.4, entreSort], [11.8, o.kx, 0.32, entreSort]]);
    y = glisse(t, 1750, [[9.4, 905, 0.36, sortExpo], [10.6, 1120, 0.4, entreSort], [11.8, o.ky, 0.32, entreSort]]);
    if (t >= 12.0) { x = o.kx; y = o.ky; }
    appui = Math.max(bosse(t, 9.5, 0.16), t >= 11.98 && t < 13.0 ? clamp((t - 11.98) / 0.06) : 0);
    clic = t >= 9.5 && t < 10.0 ? t - 9.5 : -1;
  } else if (dans(t, 15.7, 18.02)) {
    v = true;
    const b = rectBouton();
    x = glisse(t, 1520, [[15.7, BX[4] + 10, 0.28, sortExpo], [16.75, b.x + b.w * 0.62, 0.45, entreSort]]);
    y = glisse(t, 1760, [[15.7, RANG_Y + 30, 0.28, sortExpo], [16.75, b.y + b.h * 0.6, 0.45, entreSort]]);
    if (dans(t, 16.0, 16.5)) y += 100 * entreSort(prog(t, 16.0, 0.5));
    else if (dans(t, 16.5, 16.75)) y += 100;
    appui = Math.max(t >= 16.0 && t < 16.5 ? clamp((t - 16.0) / 0.06) : 0, bosse(t, 17.5, 0.16));
    clic = t >= 17.5 ? t - 17.5 : (t >= 16.5 && t < 16.95 ? t - 16.5 : -1);
  } else if (dans(t, 24.75, 25.85)) {
    v = true;
    x = glisse(t, 1500, [[24.75, 880, 0.26, sortExpo]]); y = glisse(t, 1700, [[24.75, 960, 0.26, sortExpo]]);
    appui = bosse(t, 25.5, 0.16); clic = t >= 25.5 ? t - 25.5 : -1;
    ech = 1 - entreSort(prog(t, 25.62, 0.18));
  }
  X.curseur.poser(x, y, { visible: v && ech > 0.01, appui, clic, echelle: ech });
}

// ----------------------------------------------------------------------------------------------
// Caméra et rendu
// ----------------------------------------------------------------------------------------------
function cameraMonde(t) {
  // Plongée dans la tuile « Devis » : zoom exponentiel qui arrive pile à 8,0 s (le drop).
  if (t >= 8.0) {
    const z = piste(t, 1, [[11.95, 1.06, 'camera'], [12.95, 1, 'camera']]);
    return { x: 720, y: lerp(900, 951, (z - 1) / 0.06), s: z };
  }
  return { x: 720, y: 900, s: 1 };
}

async function rendre(t) {
  const cam = cameraMonde(t);
  M.camera(monde, cam.x, cam.y, cam.s);
  M.camera(pointeur, cam.x, cam.y, cam.s);
  bento(t);
  ouverture(t);
  const o = outil(t);
  equipe(t);
  preuve(t);
  await reel(t);
  fin(t);
  motFin(t);
  curseur(t, o);
}

M.film({ duree: DUREE, construire, rendre });
