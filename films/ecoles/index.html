<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Film écoles</title>
<link rel="stylesheet" href="../moteur/base.css">
<style>
  .pilule { position: absolute; left: 0; top: 0; background: #0E1A2B; overflow: hidden; }
  .pilule-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .accroche { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .accroche .masque-in { font: 400 96px/1.2 "Instrument Serif"; color: #fff; white-space: nowrap; letter-spacing: -0.012em; }
  .fait { position: relative; display: inline-block; }
  .fait-trait { position: absolute; left: -0.04em; right: -0.04em; bottom: 0.06em; height: 0.09em; background: #F7E495; border-radius: 0.05em; transform-origin: 0 50%; }
  .tuile { position: absolute; left: 0; top: 0; width: 380px; height: 380px; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 28px -12px rgba(14,26,43,0.3); }
  .tuile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tuile-nuit { background: #0E1A2B; display: flex; align-items: center; justify-content: center; }
  .puce { position: absolute; left: 24px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; font: 600 32px/1.12 Inter; color: #0E1A2B; white-space: nowrap; }
  .horloge-tuile { position: absolute; left: 0; top: 0; width: 64px; height: 64px; transform-origin: 50% 50%; filter: drop-shadow(0 4px 8px rgba(14,26,43,0.25)); }
  .etape { position: absolute; left: 64px; top: 0; height: 100%; display: flex; align-items: center; }
  .etape .masque-in { font: 600 52px Inter; color: #0E1A2B; white-space: nowrap; letter-spacing: -0.01em; }
  .etape .coche-etape { display: inline-block; vertical-align: middle; margin-left: 18px; }
  .bouton-outil { position: absolute; top: 22px; width: 96px; height: 96px; border-radius: 50%; background: #0E1A2B; display: flex; align-items: center; justify-content: center; }
  .feuille-cours { position: absolute; left: 0; top: 0; background: #fff; border-radius: 26px; box-shadow: 0 30px 60px -24px rgba(14,26,43,0.45); overflow: hidden; }
  .barre { position: absolute; height: 14px; border-radius: 7px; background: #C9D6E6; transform-origin: 0 50%; }
  .carte-quiz { position: absolute; left: 0; top: 0; background: #fff; border-radius: 30px; box-shadow: 0 26px 50px -22px rgba(14,26,43,0.45); overflow: hidden; }
  .rond-q { position: absolute; width: 76px; height: 76px; border-radius: 50%; background: #0E1A2B; display: flex; align-items: center; justify-content: center; }
  .reponse { position: absolute; height: 84px; border-radius: 42px; background: #EEF2F7; box-shadow: inset 0 0 0 2px #D6E0EC; display: flex; align-items: center; justify-content: center; }
  .progres { position: absolute; left: 220px; top: 1500px; width: 1000px; height: 18px; border-radius: 9px; background: rgba(255,255,255,0.7); overflow: hidden; }
  .progres i { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #15803D; transform-origin: 0 50%; }
  .carte-sombre { position: absolute; left: 0; top: 0; background: #0E1A2B; }
  .feuille { position: absolute; left: 0; top: 0; width: 1440px; height: 1800px; transform-origin: 0 0; }
  .ecran { position: absolute; left: 0; top: 0; width: 1600px; height: 680px; transform-origin: 0 0; overflow: hidden; background: #0E1A2B; }
  .appel .masque-in { font: 400 96px/1.2 "Instrument Serif"; color: #fff; white-space: nowrap; letter-spacing: -0.012em; }
</style></head>
<body><div id="scene"><div class="monde" id="monde"></div><div class="calque" id="dessus"></div><div class="monde" id="pointeur"></div></div>
<script type="module">
import * as M from '../moteur/moteur.js';
import { Rang, Horloge, Coche, icone } from '../moteur/composants.js';
const { el, st, at, W, H, C, clamp, lerp, prog, ressort, piste, glisse, entreSort, sort, sortExpo, entre, visible } = M;

const DUREE = 27;
const PH = '../medias/photos/ecoles/';
const monde = document.getElementById('monde');
const dessus = document.getElementById('dessus');
const pointeur = document.getElementById('pointeur');
const bosse = (t, t0, d) => (t < t0 || t > t0 + d ? 0 : Math.sin(Math.PI * (t - t0) / d));
const dans = (t, a, b) => t >= a && t < b;
const NB = ' ';
const PHOTO_CENTRE = 'bts.jpg';

// ----------------------------------------------------------------------------------------------
// Décor recopié dans chaque verre : la classe en plein cadre
// ----------------------------------------------------------------------------------------------
const X = {};
const decorClasse = c => {
  const i = el('img', { src: PH + PHOTO_CENTRE }, c);
  Object.assign(i.style, { position: 'absolute', left: '0', top: '0', width: W + 'px', height: H + 'px', objectFit: 'cover', transformOrigin: '0 0' });
  return { img: i };
};
function majDecor(d, yPhoto) { if (d) st(d.img, { transform: `translateY(${yPhoto.toFixed(2)}px)` }); }

// ----------------------------------------------------------------------------------------------
// Bento : grille 3 x 3 de tuiles de 380 px, pas de 404 px, centrée sur (720, 900)
// ----------------------------------------------------------------------------------------------
const PAS = 404, TU = 380;
const TUILES = [
  { col: 0, lig: -1, src: 'prof-soir-recadre.jpg', doc: 'Préparer un cours', vague: 0 },
  { col: -1, lig: 0, src: 'campus.jpg', vague: 0 },
  { col: 1, lig: 0, src: 'scolarite.jpg', doc: 'Scolarité', vague: 0 },
  { col: 0, lig: 1, src: 'couloir.jpg', doc: ['Suivi des', 'alternants'], vague: 0 },
  { col: -1, lig: -1, src: 'classe.jpg', vague: 1 },
  { col: 1, lig: -1, nuit: true, vague: 1 },
  { col: -1, lig: 1, src: 'cartes.jpg', doc: 'Charte IA', vague: 1 },
  { col: 1, lig: 1, src: 'revisions.jpg', vague: 1 },
];
// Plongée dans « Révisions » (temps 16), facteur de zoom appliqué aux tailles réelles.
const S_PLONGEE = 1800 / 380;
const zb = t => (t >= 7.55 && t < 8.0 ? Math.exp(Math.log(S_PLONGEE) * entreSort(prog(t, 7.55, 0.45))) : 1);
function souleveTuile(T, t) {
  if (T.doc === 'Scolarité') return piste(t, 1, [[6.0, 1.045, 'vif'], [6.42, 1, 'vif']]);
  return 1;
}
function geoTuile(T, t) {
  const cx = 720 + T.col * PAS, cy = 900 + T.lig * PAS;
  const t0 = T.vague === 0 ? 4.0 : 4.5;
  const p = clamp(ressort(t - t0 - (Math.abs(T.col) + Math.abs(T.lig)) * 0.02, 'vif'), 0, 1.08);
  let ox = '50%', oy = '50%', sx = 1, sy = 1;
  if (T.vague === 0) {
    if (T.lig === -1) { oy = '100%'; sy = p; } else if (T.lig === 1) { oy = '0%'; sy = p; }
    else if (T.col === -1) { ox = '100%'; sx = p; } else { ox = '0%'; sx = p; }
  } else { ox = T.col === -1 ? '100%' : '0%'; sx = p; }
  const s = souleveTuile(T, t);
  return { cx, cy, sx: sx * s, sy: sy * s, ox, oy, p, s };
}
function styleTuile(g) {
  return { transform: `translate(${g.cx - TU / 2}px,${g.cy - TU / 2}px) scale(${g.sx.toFixed(4)},${g.sy.toFixed(4)})`, transformOrigin: `${g.ox} ${g.oy}`, visibility: g.sx > 0.003 && g.sy > 0.003 ? 'inherit' : 'hidden' };
}
const decorTuile = src => c => { const b = el('div', { class: 'tuile' }, c); b.style.boxShadow = 'none'; el('img', { src: PH + src }, b); return { b }; };

// ----------------------------------------------------------------------------------------------
// Sprint : temps 17 à 29
// ----------------------------------------------------------------------------------------------
const SP = { luna: 10.0, emy: 11.0, rep1: 11.5, rep2: 12.0, alex: 12.45, tour1: 13.0, tour2: 13.5, pret: 13.7, plein: 14.0, sortie: 14.5 };
const ETAPES = [
  { html: `Luna${NB}: les fiches`, t0: SP.luna, t1: SP.emy, icone: 'document' },
  { html: `Emy${NB}: le quiz`, t0: SP.emy, t1: SP.alex, icone: 'question' },
  { html: `Alex${NB}: les cartes d’apprentissage`, t0: SP.alex, t1: SP.pret, icone: 'etincelle' },
  { html: 'Prêt pour l’examen', t0: SP.pret, t1: 99, coche: true },
];
// Géométrie des cartes (centre, taille) au fil du sprint.
const CARTE_A = { cx: 720, cy: 800, w: 1000, h: 340 }, CARTE_B = { cx: 720, cy: 1190, w: 1000, h: 340 };
const PILE = { cx: 720, cy: 980, w: 820, h: 460 };
const repA = { x: 720 - 500 + 60 + 200, y: 800 + 170 - 40 - 42 };
const repB = { x: 720 + 500 - 60 - 200, y: 1190 + 170 - 40 - 42 };

// ----------------------------------------------------------------------------------------------
// Construction
// ----------------------------------------------------------------------------------------------
async function construire() {
  // --- Bento (derrière la tuile centrale) ---
  X.bento = el('div', { class: 'abs' }, monde);
  X.tuiles = TUILES.map(T => {
    const e = el('div', { class: 'tuile' + (T.nuit ? ' tuile-nuit' : '') }, X.bento);
    if (T.nuit) { T.horlogeNuit = new Horloge(e, 230, C.lampe, 'rgba(255,255,255,0.04)'); }
    else el('img', { src: PH + T.src }, e);
    return { T, e };
  });

  // --- Ouverture : mot-marque, point, pilule, iris, tuile centrale « Révisions » ---
  X.ouv = el('div', { class: 'abs' }, monde);
  X.forme = el('div', { class: 'pilule' }, X.ouv);
  X.formePhoto = el('img', { class: 'pilule-photo', src: PH + PHOTO_CENTRE }, X.forme);
  X.formeNuit = el('div', {}, X.forme); Object.assign(X.formeNuit.style, { position: 'absolute', inset: '0', background: C.nuit });
  X.accroche = el('div', { class: 'accroche' }, X.forme);
  X.accrocheL1 = M.texteMasque(X.accroche, 'Chaque prof gagne au moins');
  X.accrocheL2 = M.texteMasque(X.accroche, `<span class="fait"><span class="fait-trait"></span><span class="fait-mot">1${NB}h</span></span> par semaine`);
  X.trait = X.accroche.querySelector('.fait-trait');
  X.faitMot = X.accroche.querySelector('.fait-mot');
  X.irisSvg = el('svg:svg', { width: '100%', height: '100%', style: 'position:absolute;left:0;top:0;overflow:visible' }, X.forme);
  X.lames = [...Array(6)].map(() => el('svg:path', { fill: C.nuit, stroke: '#2B3F60', 'stroke-width': '2.5', 'stroke-linejoin': 'round' }, X.irisSvg));
  X.mm = new M.MotMarque(X.ouv, 'antoinecontino.fr', { police: '"Instrument Serif"', taille: 176, couleur: C.nuit, espacement: -176 * 0.018, indicePoint: 14 });
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = '400 96px "Instrument Serif"';
  const larg = (...l) => Math.ceil(Math.max(...l.map(s => ctx.measureText(s).width)));
  X.pilW = larg('Chaque prof gagne au moins', `1${NB}h par semaine`) + 140;
  X.pilH = 340;
  X.appelW = larg('Réservez votre échange', `de 30${NB}min`) + 140;
  X.appelH = 340;

  // Étiquettes de verre et horloges des tuiles de documents (centre compris).
  X.puces = [];
  const docs = [...TUILES.filter(T => T.doc), { col: 0, lig: 0, src: PHOTO_CENTRE, doc: 'Révisions', centre: true }];
  const mes = document.createElement('canvas').getContext('2d'); mes.font = '600 32px Inter';
  for (const T of docs) {
    const lignes = Array.isArray(T.doc) ? T.doc : [T.doc];
    const v = new M.Verre(X.ouv, { r: 32, biseau: 30, force: 46, teinte: 'rgba(255,255,255,0.66)', decor: decorTuile(T.src), marge: 40 });
    const pu = el('div', { class: 'puce' }, v.contenu);
    lignes.forEach(l => el('div', { text: l }, pu));
    const hz = el('div', { class: 'horloge-tuile' }, X.ouv);
    const hor = new Horloge(hz, 64, C.ocre, '#fff');
    X.puces.push({ T, v, w: Math.ceil(Math.max(...lignes.map(l => mes.measureText(l).width))) + 48, h: lignes.length > 1 ? 104 : 64, hz, hor });
  }

  // --- Sprint ---
  X.sprint = el('div', { class: 'abs' }, monde);
  X.decor = decorClasse(X.sprint);
  X.gooCalque = el('div', { class: 'abs' }, X.sprint);
  const ctxL = document.createElement('canvas').getContext('2d'); ctxL.font = '400 300px "Instrument Serif"';
  const mot = 'Chapitre';
  X.lettres = [...mot].map((ch, i) => {
    const l = new M.LettreVerre(X.gooCalque, ch, { police: '"Instrument Serif"', taille: 300, biseau: 24, force: 64, decor: decorClasse });
    l.x = ctxL.measureText(mot.slice(0, i)).width; return l;
  });
  X.motL = ctxL.measureText(mot).width;
  // Feuille du chapitre, qui devient la fiche puis la première carte de quiz.
  X.feuilleC = el('div', { class: 'feuille-cours' }, X.sprint);
  const barre = (parent, x, y, w, h, coul) => { const b = el('div', { class: 'barre' }, parent); Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', background: coul || '#C9D6E6' }); return b; };
  X.coursTitre = barre(X.feuilleC, 70, 70, 330, 32, C.nuit);
  X.coursLignes = [];
  for (let i = 0; i < 9; i++) X.coursLignes.push(barre(X.feuilleC, 70, 150 + i * 56, [820, 760, 800, 640, 820, 700, 780, 560, 720][i], 14));
  X.ficheLignes = [0, 1, 2, 3].map(i => {
    const r = el('div', {}, X.feuilleC); Object.assign(r.style, { position: 'absolute', left: '70px', top: 150 + i * 92 + 'px', width: '640px', height: '40px' });
    const pt = el('div', {}, r); Object.assign(pt.style, { position: 'absolute', left: '0', top: '6px', width: '28px', height: '28px', borderRadius: '50%', background: C.lampe });
    const b = barre(r, 52, 12, [560, 480, 600, 420][i], 18, i === 0 ? C.nuit : '#8FA3BC');
    return { r, pt, b };
  });
  // Contenu de quiz dans une carte : rond « ? », barre de question, deux réponses.
  const quiz = (parent, gauche) => {
    const q = el('div', { class: 'abs' }, parent);
    const rond = el('div', { class: 'rond-q' }, q); Object.assign(rond.style, { left: '60px', top: '48px' });
    icone(rond, 'question', { taille: 48, couleur: C.lampe, epaisseur: 2.2 });
    const bq = barre(q, 166, 72, 560, 30, C.nuit);
    const bq2 = barre(q, 166, 122, 380, 14);
    const reps = [0, 1].map(j => {
      const r = el('div', { class: 'reponse' }, q); Object.assign(r.style, { left: 60 + j * 460 + 'px', top: '216px', width: '420px' });
      const b = barre(r, 40, 35, j === 0 ? 220 : 260, 14);
      const ok = el('div', {}, r); Object.assign(ok.style, { position: 'absolute', right: '24px', top: '14px', width: '56px', height: '56px' });
      icone(ok, 'coche', { taille: 56, couleur: '#fff', epaisseur: 3 });
      return { r, b, ok };
    });
    return { q, rond, bq, bq2, reps, bonne: gauche ? 0 : 1 };
  };
  X.quizA = quiz(X.feuilleC, true);
  X.carteB = el('div', { class: 'carte-quiz' }, X.sprint);
  X.quizB = quiz(X.carteB, false);
  X.cartesSup = [0, 1].map(() => { const c = el('div', { class: 'carte-quiz' }, X.sprint); const q = quiz(c, true); return { c, q }; });
  X.progres = el('div', { class: 'progres' }, X.sprint); X.progresPlein = el('i', {}, X.progres);
  // Barre d'outils en verre et ses quatre étapes.
  X.barre = new M.Verre(X.sprint, { r: 70, biseau: 54, force: 96, teinte: 'rgba(255,255,255,0.58)', decor: decorClasse });
  X.etapes = ETAPES.map(E => {
    const zone = el('div', { class: 'etape' }, X.barre.contenu);
    const tm = M.texteMasque(zone, E.html + (E.coche ? '<span class="coche-etape"></span>' : ''));
    const r = { E, zone, tm };
    if (E.coche) r.coche = new Coche(tm.i.querySelector('.coche-etape'), 58);
    return r;
  });
  X.boutonOutil = el('div', { class: 'bouton-outil' }, X.barre.contenu);
  X.iconesOutil = ['etincelle', ...ETAPES.slice(0, 3).map(E => E.icone)].map(n => { const h = el('div', {}, X.boutonOutil); Object.assign(h.style, { position: 'absolute', left: '23px', top: '23px', width: '50px', height: '50px' }); icone(h, n, { taille: 50, couleur: '#fff', epaisseur: 2.2 }); return h; });

  // --- Preuve et monde réel (calque du dessus, sans caméra) ---
  X.reel = el('div', { class: 'abs' }, dessus);
  X.preuve = el('div', { class: 'abs' }, dessus);
  X.carte = el('div', { class: 'carte-sombre' }, X.preuve);
  X.feuilleTexte = el('div', { class: 'feuille' }, X.preuve);
  X.rangs = [
    new Rang(X.feuilleTexte, { html: `Échange de 30${NB}min`, icone: 'calendrier', coche: true }),
    new Rang(X.feuilleTexte, { html: 'Une journée avec votre équipe', image: '../medias/portrait.webp' }),
    new Rang(X.feuilleTexte, { html: '2 séances avec une classe', icone: 'groupe' }),
    new Rang(X.feuilleTexte, { html: 'À midi, vous décidez si vous payez', icone: 'soleil' }),
    new Rang(X.feuilleTexte, { html: 'Chaque élève repart avec ses fiches', icone: 'document', coche: true }),
  ];
  X.plan = new M.Plan(X.reel, '../medias/plans/reel_ecoles_intra.webm');
  await X.plan.charger();
  Object.assign(X.plan.canvas.style, { position: 'absolute', left: '0', top: '0', width: W + 'px', height: H + 'px' });
  X.coins = await (await fetch('../medias/plans/coins_ecoles.json')).json();
  X.voileSvg = el('svg:svg', { width: W, height: H, style: 'position:absolute;left:0;top:0' }, X.reel);
  X.voile = el('svg:polygon', { fill: C.nuit }, X.voileSvg);
  // Écran du téléphone : une carte de quiz, la bonne réponse se coche.
  X.ecran = el('div', { class: 'ecran' }, dessus);
  X.ecranCarte = el('div', { class: 'carte-quiz' }, X.ecran);
  Object.assign(X.ecranCarte.style, { left: '120px', top: '90px', width: '1360px', height: '500px', borderRadius: '44px' });
  X.ecranQuiz = quiz(X.ecranCarte, true);
  Object.assign(X.ecranQuiz.q.style, { transform: 'scale(1.3)', transformOrigin: '0 0' });
  X.irisFinSvg = el('svg:svg', { width: W, height: H, style: 'position:absolute;left:0;top:0' }, dessus);
  X.lamesFin = [...Array(6)].map(() => el('svg:path', { fill: C.nuit, stroke: '#2B3F60', 'stroke-width': '3', 'stroke-linejoin': 'round' }, X.irisFinSvg));

  // --- Fin : pilule d'appel qui redevient le point ---
  X.fin = el('div', { class: 'abs' }, dessus);
  X.finNoir = el('div', {}, X.fin); Object.assign(X.finNoir.style, { position: 'absolute', left: '0', top: '0', background: C.nuit });
  X.appel = el('div', { class: 'accroche appel' }, X.finNoir);
  X.appelL1 = M.texteMasque(X.appel, 'Réservez votre échange');
  X.appelL2 = M.texteMasque(X.appel, `de 30${NB}min`);

  // --- Curseur, dans le monde pour suivre le zoom ---
  X.curseur = new M.Curseur(pointeur);
}

// ----------------------------------------------------------------------------------------------
// Ouverture et bento : temps 1 à 16
// ----------------------------------------------------------------------------------------------
const liftCentre = t => piste(t, 1, [[6.5, 1.045, 'vif'], [7.0, 0.975, 'sec'], [7.5, 1.0, 'vif']]);

function ouverture(t) {
  const actif = t < 8.02;
  visible(X.ouv, actif);
  if (!actif) return;
  visible(X.forme, true);
  // Mot-marque : écrasement dans le point (temps 1).
  const k = 1 - entreSort(prog(t, 0.02, 0.4));
  const pt = X.mm.poser(720, 900, k);
  visible(X.mm.racine, t < 0.5);
  // Le point devient la pilule (temps 2), puis l'iris, le disque, le carré, la tuile.
  const cx = piste(t, pt.x, [[0.38, 720, 'sec']]), cy = piste(t, pt.y, [[0.38, 900, 'sec']]);
  let w = piste(t, pt.d, [[0.44, X.pilW, 'vif'], [3.12, 640, 'vif'], [3.5, 980, 'vif'], [3.75, TU, 'sec']]);
  let h = piste(t, pt.d, [[0.42, X.pilH, 'vif'], [3.12, 640, 'vif'], [3.5, 980, 'vif'], [3.75, TU, 'sec']]);
  const survol = piste(t, 1, [[2.3, 1.035, 'vif'], [2.8, 0.985, 'sec'], [2.92, 1, 'vif']]) * liftCentre(t);
  w *= survol * zb(t); h *= survol * zb(t);
  const rayon = t < 3.5 ? Math.min(w, h) / 2 : piste(t, 320, [[3.5, 48, 'vif'], [3.75, 28, 'vif'], [7.55, 0, 'sec']]);
  const ombre = clamp((survol - 1) / 0.035, 0, 1.5);
  st(X.forme, { width: w.toFixed(2) + 'px', height: h.toFixed(2) + 'px', borderRadius: Math.max(0, rayon).toFixed(2) + 'px',
    transform: `translate(${(cx - w / 2).toFixed(2)}px,${(cy - h / 2).toFixed(2)}px)`,
    boxShadow: `0 ${(30 * ombre).toFixed(1)}px ${(60 * ombre).toFixed(1)}px -20px rgba(14,26,43,0.45)` });
  M.monte(X.accrocheL1, ressort(t - 0.56, 'vif'));
  M.monte(X.accrocheL2, ressort(t - 0.62, 'vif'));
  st(X.trait, { transform: `scaleX(${clamp(ressort(t - 1.0, 'sec'), 0, 1.1).toFixed(4)})` });
  const pc = clamp(ressort(t - 1.0, 'sec'));
  st(X.faitMot, { color: `rgb(${Math.round(lerp(255, 247, pc))},${Math.round(lerp(255, 228, pc))},${Math.round(lerp(255, 149, pc))})` });
  visible(X.accroche, t < 3.2);

    appui = Math.max(bosse(t, SP.luna, 0.16), bosse(t, SP.rep1, 0.16), bosse(t, SP.rep2, 0.16));

  X.curseur.poser(x, y, { visible: v && ech > 0.01, appui, clic, echelle: ech });
}
